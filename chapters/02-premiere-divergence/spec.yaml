# Le brief du chapitre complet (trois entrées), en langue du monde (v4).
brief: |-
  Chapitre 2 complet, trois entrées du carnet à dates consécutives, 450-600 mots chacune. Ce que le chapitre raconte : la première divergence — l'entrée relue de son cahier mentionne une seconde assiette (citation à recopier verbatim dans l'entrée concernée : « Deux assiettes mises, sans y penser. Je l'ai laissée sur la table jusqu'au matin. »), elle va voir à la cuisine, elle se donne une raison — la fatigue —, elle rend son verdict : erreur de relevé, et la résolution de pointer plus précisément.
  CE QU'ELLE VOIT, imposé : « L'égouttoir, ce soir : deux assiettes. »
  En-tête : jamais de mois, jamais d'année.
  Interdits : aucun nom propre, aucun dialogue, aucune explication, « journal » et « journal intime » bannis, aucun terme réservé (la tierce, l'errata, le bon à tirer).

# Le brief d'entrée unique des runs SCORÉS de calibration (v4) : l'en-tête et
# la citation sont déjà écrits par le code.
entry_brief: |-
  Chapitre 2, entrée unique du carnet, 450-600 mots.
  L'en-tête et la citation sont DÉJÀ ÉCRITS.
  Ce qui reste, dans l'ordre : elle relit, constate l'écart, va vérifier ; elle rétablit sa soirée ; elle rend son verdict ; le corps constate, une ligne ; une phrase brève referme.
  Le soir : elle relit l'entrée de la veille de son cahier, comme chaque soir. Sa mémoire dit une assiette, un dîner seule ; l'entrée en compte deux. Elle va voir : la cuisine, l'égouttoir — regarder, compter. Ce qu'elle voit confirme l'entrée, pas sa mémoire. Elle se donne une raison : la fatigue, l'automatisme.
  Verdict à rendre, dans ses mots : erreur de relevé — la faute est à elle, pas au texte ; et la résolution de pointer plus précisément.
  Dans la maison, ce soir : le cahier, l'assiette, l'égouttoir.
  CE QU'ELLE VOIT, imposé : « L'égouttoir, ce soir : deux assiettes. » Elle le CONSTATE, elle ne le découvre pas.
  En-tête : jamais de mois, jamais d'année.
  Interdits : aucun nom propre, aucun dialogue, aucune explication, « journal » et « journal intime » bannis, aucun terme réservé (la tierce, l'errata, le bon à tirer).

