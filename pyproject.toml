[project]
name = "writing-factory"
version = "0.1.0"
description = "Local-only chapter generation pipeline for L'Involontaire (author mode, actor mode, cloned-voice rendering)."
requires-python = ">=3.10"
dependencies = [
    "langgraph>=1.0",
    "chromadb-client>=0.5",
    "python-frontmatter>=1.1",
    "httpx>=0.27",
    "pyyaml>=6",
]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
factory = ["api/static/*", "eval/data/*"]

[project.optional-dependencies]
# Cloned-voice rendering: Apple Silicon only (mlx). Installed on the stage
# machine, never in the test environment; the import is lazy (ADR-0012).
tts = ["mlx-audio>=0.4", "soundfile>=0.12", "numpy>=1.26"]
test = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
markers = [
    "snapshot: compares served prompts and assembled chapters to golden files",
]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = [".venv", "data", "runs*", "retour-*", "journal-des-murs"]

[tool.ruff.lint]
# Repository-wide: only what is certainly a bug (syntax errors, undefined
# names, misuse of builtins). The full style set applies to tests/ below; the
# rest of the code gets it when it moves into the package (step 4).
select = ["E9", "F63", "F7", "F82"]

[tool.ruff.lint.isort]
known-first-party = ["factory", "fakes", "snapshots"]
