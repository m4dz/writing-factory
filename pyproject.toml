[project]
name = "writing-factory"
version = "0.1.0"
description = "Local-only chapter generation pipeline for L'Involontaire (author mode, actor mode, cloned-voice rendering)."
requires-python = ">=3.10"
# Runtime dependencies stay in orchestrator/requirements.txt until the
# packaging step (revamp step 4) moves the code under src/factory/.
dependencies = []

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

# No package yet: the code lives in script directories until revamp step 4.
# Until then `pip install -e ".[test]"` installs only the dependencies, and
# setuptools must not try to discover packages in the flat layout.
[tool.setuptools]
packages = []

[project.optional-dependencies]
test = [
    "pytest>=8",
    "ruff>=0.6",
    "langgraph>=1.0",
    "chromadb-client>=0.5",
    "python-frontmatter>=1.1",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
markers = [
    "snapshot: compares served prompts and assembled chapters to golden files",
]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = [".venv", "data", "runs*", "retour-*", "journal-des-murs"]

[tool.ruff.lint]
# Repository-wide: only what is certainly a bug (syntax errors, undefined
# names, misuse of builtins). The full style set applies to tests/ below; the
# rest of the code gets it when it moves into the package (step 4).
select = ["E9", "F63", "F7", "F82"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = []

[tool.ruff.lint.extend-per-file-ignores]
